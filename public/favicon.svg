<svg viewBox="0 0 40 40" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08041d" />
      <stop offset="50%" stop-color="#120c33" />
      <stop offset="100%" stop-color="#050212" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Z Gradient: Cyan to Indigo -->
    <linearGradient id="fav-z" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- S Gradient: Violet to Mint/Emerald -->
    <linearGradient id="fav-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="1" y="1" width="38" height="38" rx="10" fill="url(#fav-bg)" stroke="url(#fav-border)" stroke-width="1.6" />

  <!-- Ambient Glow Circles -->
  <circle cx="12" cy="12" r="8" fill="#38bdf8" fill-opacity="0.25" />
  <circle cx="28" cy="28" r="8" fill="#34d399" fill-opacity="0.2" />

  <!-- Letter Z -->
  <path
    d="M 9 12.5 H 20.5 L 10 27.5 H 21.5"
    stroke="url(#fav-z)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Letter S -->
  <path
    d="M 31 15.2 C 30.2 13.2 28.2 12.2 25.8 12.2 C 23.2 12.2 21.8 13.6 21.8 15.8 C 21.8 19.8 31 19.2 31 23.8 C 31 26.6 28.8 27.8 25.8 27.8 C 23.2 27.8 21.8 26.4 21.4 24.6"
    stroke="url(#fav-s)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Micro Sparkle Accent (✦) -->
  <path
    d="M 32 7.5 L 32.7 9.3 L 34.5 10 L 32.7 10.7 L 32 12.5 L 31.3 10.7 L 29.5 10 L 31.3 9.3 Z"
    fill="#38bdf8"
  />
</svg>
